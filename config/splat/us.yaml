# splat configuration for SCUS_971.98 (NTSC-U v1.00), the primary target.
#
# A first split: one unit per ELF section. File boundaries (from the May 2002
# prototype's stabs, docs/PROTOTYPE.md) come next. tools/setup_asm.py runs this.
name: Sly Cooper and the Thievius Raccoonus (USA)
sha1: 57dc305db57932ad3f1122966cdb695d2e62a47a

options:
  basename: SCUS_971.98
  target_path: baserom/us/SCUS_971.98
  elf_path: build/us/SCUS_971.98.elf
  base_path: ../..
  platform: ps2
  compiler: EEGCC

  asm_path: asm/us
  src_path: src
  build_path: build/us
  ld_script_path: build/us/SCUS_971.98.splat.ld

  symbol_addrs_path: config/us/symbol_addrs.txt
  create_undefined_funcs_auto: True
  undefined_funcs_auto_path: build/us/undefined_funcs_auto.txt
  create_undefined_syms_auto: True
  undefined_syms_auto_path: build/us/undefined_syms_auto.txt

  generate_asm_macros_files: True
  named_regs_for_c_funcs: False
  find_file_boundaries: False
  disasm_unknown: True
  rodata_string_guesser_level: 0
  migrate_rodata_to_functions: False
  section_order: [".text", ".vutext", ".rodata", ".data", ".gcc_except_table", ".sbss", ".bss"]
  subalign: null

segments:
  - [0x0, databin, elf_header]

  - name: main
    type: code
    start: 0x1000
    vram: 0x100000
    bss_size: 0x3B1384      # .sbss (0x27B300) through the end of .bss (0x62C684)
    subsegments:
      - [0x001000, asm, text]                    # .text     0x100000, 0x111E0C bytes
      - [0x112E10, bin, vutext]                  # .vutext   0x211E10, VU microcode
      - [0x118380, rodata, rodata]               # .rodata   0x217380
      - [0x151580, data, data]                   # .data     0x250580
      - [0x17C200, bin, gcc_except_table]        # .gcc_except_table 0x27B200
      - { start: 0x17C294, type: bss, vram: 0x27B300, name: bss }

  # The DVP overlay sections, .reginfo, .stack, the overlay tables and the
  # section header table: copied as they are until the linker script models them.
  - [0x17C354, databin, elf_tail]
  - [0x1A20C8]
